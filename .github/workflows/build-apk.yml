name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Revisar que Android (ICU) acepte las expresiones regulares
        run: python3 scripts/check_regex_icu.py app/src/main/java
      - name: Probar el clasificador de películas y series
        run: ./gradlew testDebugUnitTest
      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: repropower-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
